name: Banda Chat direct contact repair

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'fix: direct contact auto add unread' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Repair direct contact auto-add
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/chat/page.tsx')
          text = path.read_text()

          old = '''            setContactInfo(\n              (previous) => {\n                const next = {\n                  ...previous,\n                };\n\n                const matchedUserId =\n                  Object.keys(\n                    next\n                  ).find(\n                    (userId) =>\n                      next[userId]\n                        .conversationId ===\n                      newMessage.conversation_id\n                  );\n\n                if (\n                  matchedUserId\n                ) {\n                  next[\n                    matchedUserId\n                  ] = {\n                    ...next[\n                      matchedUserId\n                    ],\n                    lastMessage:\n                      newMessage.content,\n                    lastMessageAt:\n                      newMessage.created_at,\n                    unreadCount:\n                      next[\n                        matchedUserId\n                      ].unreadCount +\n                      1,\n                  };\n                }\n\n                return next;\n              }\n            );\n\n            refreshContactInfoRealtime();'''

          new = '''            const {\n              data: senderProfile,\n              error: senderProfileError,\n            } = await supabase\n              .from("profiles")\n              .select("id, full_name, username, avatar_url")\n              .eq("id", newMessage.sender_id)\n              .maybeSingle();\n\n            if (senderProfileError) {\n              console.error(\n                "Load incoming sender profile error:",\n                senderProfileError\n              );\n            }\n\n            setContactInfo(\n              (previous) => {\n                const next = {\n                  ...previous,\n                };\n\n                const matchedUserId =\n                  Object.keys(next).find(\n                    (userId) =>\n                      next[userId].conversationId ===\n                      newMessage.conversation_id\n                  );\n\n                if (matchedUserId) {\n                  next[matchedUserId] = {\n                    ...next[matchedUserId],\n                    lastMessage: newMessage.content,\n                    lastMessageAt: newMessage.created_at,\n                    unreadCount:\n                      next[matchedUserId].unreadCount + 1,\n                  };\n                } else if (senderProfile) {\n                  /*\n                   * Pesan pertama dari pengguna lain harus langsung membuat\n                   * kontak. Tidak bergantung pada apakah pengguna tersebut\n                   * pernah dicari atau dibuka sebelumnya.\n                   */\n                  next[senderProfile.id] = {\n                    conversationId: newMessage.conversation_id,\n                    lastMessage: newMessage.content,\n                    lastMessageAt: newMessage.created_at,\n                    unreadCount: 1,\n                  };\n                }\n\n                return next;\n              }\n            );\n\n            refreshContactInfoRealtime();'''

          if old not in text:
              raise SystemExit('Target realtime contact block not found; no changes made.')

          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/chat/page.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: direct contact auto add unread"
          git push origin master

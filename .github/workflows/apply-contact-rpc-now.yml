name: Apply direct contact RPC loader

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace contact loader
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/chat/page.tsx')
          text = path.read_text(encoding='utf-8')

          start_marker = '  async function loadContactInfo(\n    authUserId: string\n  ) {'
          end_marker = '\n  function refreshContactInfoRealtime()'

          start = text.find(start_marker)
          end = text.find(end_marker, start)

          if start < 0 or end < 0:
              raise SystemExit('loadContactInfo markers not found; no changes made.')

          replacement = '''  async function loadContactInfo(
    authUserId: string
  ) {
    try {
      const { data, error } = await supabase.rpc(
        "get_my_direct_contacts"
      );

      if (error) {
        console.error(
          "Load direct contacts RPC error:",
          error
        );
        return;
      }

      const aggregatedInfo: Record<string, ContactInfo> = {};

      (data || []).forEach(
        (row: {
          user_id: string;
          conversation_id: string;
          last_message: string | null;
          last_message_at: string | null;
          unread_count: number | string | null;
        }) => {
          if (!row.user_id || row.user_id === authUserId) {
            return;
          }

          aggregatedInfo[row.user_id] = {
            conversationId: row.conversation_id,
            lastMessage: row.last_message,
            lastMessageAt: row.last_message_at,
            unreadCount: Number(row.unread_count || 0),
          };
        }
      );

      setContactInfo(aggregatedInfo);
    } catch (error) {
      console.error(
        "Load contact info error:",
        error
      );
    }
  }
'''

          updated = text[:start] + replacement + text[end:]

          if updated == text:
              raise SystemExit('No change produced.')

          path.write_text(updated, encoding='utf-8')

      - name: Commit page.tsx
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/chat/page.tsx
          if git diff --cached --quiet; then
            echo "page.tsx already patched"
            exit 0
          fi
          git commit -m "fix: use direct contact RPC in chat loader"
          git push

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-contact-rpc-now.yml
          git commit -m "chore: remove temporary contact patch workflow"
          git push
name: Fix first incoming direct contact

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch incoming direct contact detection
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/chat/page.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''            const {
              data: conversationMembers,
              error: conversationMembersError,
            } = await supabase
              .from("conversation_members")
              .select("user_id")
              .eq(
                "conversation_id",
                newMessage.conversation_id
              );

            if (conversationMembersError) {
              console.error(
                "Incoming contact members error:",
                conversationMembersError
              );
            }

            const incomingContactUserId =
              (conversationMembers || [])
                .map((member) => member.user_id)
                .find((userId) => userId !== currentUserId);'''

          new = '''            const {
              data: conversation,
              error: conversationError,
            } = await supabase
              .from("conversations")
              .select("id, type")
              .eq(
                "id",
                newMessage.conversation_id
              )
              .maybeSingle();

            if (conversationError) {
              console.error(
                "Incoming conversation lookup error:",
                conversationError
              );
            }

            if (conversation?.type !== "direct") {
              refreshContactInfoRealtime();
              return;
            }

            // For a direct conversation the sender_id is the contact.
            // Do not depend on conversation_members RLS to discover it.
            const incomingContactUserId =
              newMessage.sender_id !== currentUserId
                ? newMessage.sender_id
                : null;'''

          if old not in text:
              raise SystemExit(
                  'Incoming contact block not found; page.tsx was not changed.'
              )

          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Remove obsolete patch workflows and commit the real fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find .github/workflows -type f -name '*.yml' ! -name 'fix-contact-merge.yml' -delete
          find .github/workflows -type f -name '*.yaml' -delete

          git add app/chat/page.tsx .github/workflows
          git commit -m "fix: automatically add first direct-message contact" || exit 0
          git push

name: Fix contact merge

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch contact refresh merge
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/chat/page.tsx')
          text = path.read_text(encoding='utf-8')

          old_empty = '''      if (\n        !myMemberships ||\n        myMemberships.length === 0\n      ) {\n        setContactInfo({});\n        return;\n      }'''

          new_empty = '''      if (\n        !myMemberships ||\n        myMemberships.length === 0\n      ) {\n        return;\n      }'''

          if old_empty not in text:
              raise SystemExit('Expected empty-membership block was not found; no changes made.')

          text = text.replace(old_empty, new_empty, 1)

          old_set = '''      setContactInfo(\n        aggregatedInfo\n      );'''

          new_set = '''      setContactInfo((previous) => {\n        const next = { ...previous };\n\n        Object.entries(aggregatedInfo).forEach(\n          ([userId, info]) => {\n            const existing = next[userId];\n\n            if (!existing) {\n              next[userId] = info;\n              return;\n            }\n\n            const existingTime = existing.lastMessageAt\n              ? new Date(existing.lastMessageAt).getTime()\n              : 0;\n\n            const incomingTime = info.lastMessageAt\n              ? new Date(info.lastMessageAt).getTime()\n              : 0;\n\n            if (incomingTime >= existingTime) {\n              next[userId] = {\n                ...existing,\n                ...info,\n              };\n            } else {\n              next[userId] = {\n                ...info,\n                ...existing,\n              };\n            }\n          }\n        );\n\n        return next;\n      });'''

          if old_set not in text:
              raise SystemExit('Expected contactInfo replacement block was not found; no changes made.')

          text = text.replace(old_set, new_set, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit page fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/chat/page.tsx
          git commit -m "fix: preserve automatic contacts" || exit 0
          git push

name: Apply final contact and media fix

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch chat page
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/chat/page.tsx")
          text = path.read_text(encoding="utf-8")
          original = text

          old_contact = '''            const {
              data: conversationMembers,
              error: conversationMembersError,
            } = await supabase
              .from("conversation_members")
              .select("user_id")
              .eq(
                "conversation_id",
                newMessage.conversation_id
              );

            if (conversationMembersError) {
              console.error(
                "Incoming contact members error:",
                conversationMembersError
              );
            }

            const incomingContactUserId =
              (conversationMembers || [])
                .map((member) => member.user_id)
                .find((userId) => userId !== currentUserId);'''

          new_contact = '''            // The message itself is the authoritative source of the sender.
            // Do not depend on a separate conversation_members read here;
            // that query can be blocked/delayed by RLS and caused first-contact
            // messages to disappear from the home contact list.
            const incomingContactUserId =
              newMessage.sender_id !== currentUserId
                ? newMessage.sender_id
                : null;'''

          if old_contact not in text:
              raise SystemExit("Expected realtime contact block was not found; refusing to modify page.tsx.")

          text = text.replace(old_contact, new_contact, 1)

          old_download = '''  function downloadAttachment(attachment: MessageAttachment) {
    const link = document.createElement("a");
    link.href = attachment.url;
    link.download = attachment.name;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    document.body.appendChild(link);
    link.click();
    link.remove();
  }'''

          new_download = '''  async function downloadAttachment(attachment: MessageAttachment) {
    try {
      const response = await fetch(attachment.url, {
        cache: "no-store",
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const blob = await response.blob();
      const objectUrl = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = objectUrl;
      link.download = attachment.name || "download";
      link.style.display = "none";

      document.body.appendChild(link);
      link.click();
      link.remove();

      window.setTimeout(() => {
        URL.revokeObjectURL(objectUrl);
      }, 1000);
    } catch (error) {
      console.error("Download attachment error:", error);

      // Fallback for browsers/storage configurations that block fetching
      // the public object as a blob.
      const link = document.createElement("a");
      link.href = attachment.url;
      link.download = attachment.name || "download";
      link.rel = "noopener noreferrer";
      document.body.appendChild(link);
      link.click();
      link.remove();
    }
  }'''

          if old_download not in text:
              raise SystemExit("Expected downloadAttachment function was not found; refusing to modify page.tsx.")

          text = text.replace(old_download, new_download, 1)

          if text == original:
              raise SystemExit("No changes were made.")

          path.write_text(text, encoding="utf-8")

      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/chat/page.tsx
          git commit -m "fix: automatic first contact and attachment downloads"
          git push

name: Fix auto contacts

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch realtime incoming contact handling
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/chat/page.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''            setContactInfo(\n              (previous) => {\n                const next = {\n                  ...previous,\n                };\n\n                const matchedUserId =\n                  Object.keys(\n                    next\n                  ).find(\n                    (userId) =>\n                      next[userId]\n                        .conversationId ===\n                      newMessage.conversation_id\n                  );\n\n                if (\n                  matchedUserId\n                ) {\n                  next[\n                    matchedUserId\n                  ] = {\n                    ...next[\n                      matchedUserId\n                    ],\n                    lastMessage:\n                      newMessage.content,\n                    lastMessageAt:\n                      newMessage.created_at,\n                    unreadCount:\n                      next[\n                        matchedUserId\n                      ].unreadCount +\n                      1,\n                  };\n                }\n\n                return next;\n              }\n            );\n\n            refreshContactInfoRealtime();'''

          new = '''            const {\n              data: conversationMembers,\n              error: conversationMembersError,\n            } = await supabase\n              .from("conversation_members")\n              .select("user_id")\n              .eq(\n                "conversation_id",\n                newMessage.conversation_id\n              );\n\n            if (conversationMembersError) {\n              console.error(\n                "Incoming contact members error:",\n                conversationMembersError\n              );\n            }\n\n            const incomingContactUserId =\n              (conversationMembers || [])\n                .map((member) => member.user_id)\n                .find((userId) => userId !== currentUserId);\n\n            if (incomingContactUserId) {\n              setContactInfo((previous) => {\n                const existing =\n                  previous[incomingContactUserId];\n\n                return {\n                  ...previous,\n                  [incomingContactUserId]: {\n                    conversationId:\n                      newMessage.conversation_id,\n                    lastMessage:\n                      newMessage.content,\n                    lastMessageAt:\n                      newMessage.created_at,\n                    unreadCount:\n                      (existing?.unreadCount || 0) + 1,\n                  },\n                };\n              });\n            }\n\n            await loadContactInfo(currentUserId);\n\n            setContactInfo((previous) => {\n              if (!incomingContactUserId) {\n                return previous;\n              }\n\n              const existing = previous[incomingContactUserId];\n\n              return {\n                ...previous,\n                [incomingContactUserId]: {\n                  conversationId:\n                    newMessage.conversation_id,\n                  lastMessage:\n                    newMessage.content,\n                  lastMessageAt:\n                    newMessage.created_at,\n                  unreadCount:\n                    existing?.unreadCount || 1,\n                },\n              };\n            });\n\n            refreshContactInfoRealtime();'''

          if old not in text:
              raise SystemExit('Target realtime contact block was not found; no changes made.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/chat/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: automatically add first-time incoming chat contact"
          git push

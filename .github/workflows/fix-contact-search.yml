name: Fix automatic contacts and attachment download

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch chat page
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/chat/page.tsx")
          text = path.read_text(encoding="utf-8")
          changed = False

          old_contact = '''            const incomingContactUserId =
              (conversationMembers || [])
                .map((member) => member.user_id)
                .find((userId) => userId !== currentUserId);
'''

          new_contact = '''            const incomingContactUserId =
              newMessage.sender_id !== currentUserId
                ? newMessage.sender_id
                : null;
'''

          if old_contact in text:
              text = text.replace(old_contact, new_contact, 1)
              changed = True
              print("Fixed incoming contact detection")
          elif "newMessage.sender_id !== currentUserId" in text:
              print("Incoming contact detection is already fixed")
          else:
              raise SystemExit("Incoming contact block not found")

          old_download = '''  function downloadAttachment(attachment: MessageAttachment) {
    const link = document.createElement("a");
    link.href = attachment.url;
    link.download = attachment.name;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    document.body.appendChild(link);
    link.click();
    link.remove();
  }
'''

          new_download = '''  async function downloadAttachment(attachment: MessageAttachment) {
    try {
      const response = await fetch(attachment.url, {
        cache: "no-store",
      });

      if (!response.ok) {
        throw new Error(`Download gagal (${response.status})`);
      }

      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = blobUrl;
      link.download = attachment.name || "download";
      link.style.display = "none";
      document.body.appendChild(link);
      link.click();
      link.remove();

      window.setTimeout(() => {
        URL.revokeObjectURL(blobUrl);
      }, 1000);
    } catch (error) {
      console.error("Download attachment error:", error);
      setErrorMessage(
        error instanceof Error
          ? error.message
          : "File gagal diunduh."
      );
    }
  }
'''

          if old_download in text:
              text = text.replace(old_download, new_download, 1)
              changed = True
              print("Fixed attachment download")
          elif "async function downloadAttachment" in text and "URL.createObjectURL(blob)" in text:
              print("Attachment download is already fixed")
          else:
              raise SystemExit("Attachment download block not found")

          if changed:
              path.write_text(text, encoding="utf-8")
              print("app/chat/page.tsx patched")
          else:
              print("No page changes needed")

      - name: Commit page change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/chat/page.tsx
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi
          git commit -m "fix: automatic incoming contacts and attachment downloads"
          git push

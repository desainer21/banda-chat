name: Fix automatic contact from incoming message

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch incoming contact logic
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/chat/page.tsx")
          text = path.read_text(encoding="utf-8")

          old = '''            const incomingContactUserId =
              (conversationMembers || [])
                .map((member) => member.user_id)
                .find((userId) => userId !== currentUserId);
'''

          new = '''            const incomingContactUserId =
              newMessage.sender_id !== currentUserId
                ? newMessage.sender_id
                : null;
'''

          if old not in text:
              raise SystemExit("Target incoming contact block was not found; no changes made.")

          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          print("Patched incoming contact user ID to use messages.sender_id")

      - name: Commit page change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/chat/page.tsx
          git commit -m "fix: identify incoming contact from message sender"
          git push
